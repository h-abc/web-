<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026世界杯 - 官方完赛数据</title>
    <style>
        :root {
            --primary: #1a3c5e;
            --secondary: #c8a951;
            --accent: #e63946;
            --bg: #f5f0e8;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --text-light: #6b6b6b;
            --border: #e0d8cc;
            --success: #2a9d8f;
            --warning: #e9c46a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 10px;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }
        .header { background:linear-gradient(135deg,#0d2847,#1a3c5e 40%,#1e4d7b); color:#fff; position:sticky; top:0; z-index:100; box-shadow:0 4px 20px rgba(0,0,0,.3); }
        .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 24px; flex-wrap:wrap; gap:10px; }
        .logo { display:flex; align-items:center; gap:12px; font-size:1.4em; font-weight:700; letter-spacing:.5px; }
        .logo-icon { width:44px; height:44px; border-radius:50%; background:var(--secondary); display:flex; align-items:center; justify-content:center; font-size:1.6em; }
        .nav-links { display:flex; gap:6px; flex-wrap:wrap; }
        .nav-links button { background:rgba(255,255,255,.08); color:#e0d8cc; border:1px solid rgba(255,255,255,.15); padding:9px 18px; border-radius:25px; cursor:pointer; font-size:.95em; transition:all var(--transition); white-space:nowrap; font-weight:500; }
        .nav-links button:hover,.nav-links button.active { background:rgba(255,255,255,.2); color:#fff; border-color:var(--secondary); box-shadow:0 0 16px rgba(200,169,81,.3); }
        .nav-links button.active { background:var(--secondary); color:#1a3c5e; border-color:var(--secondary); font-weight:700; }
        .main-container { max-width:1200px; margin:0 auto; padding:24px; }
        .page-title { font-size:1.8em; font-weight:700; margin-bottom:20px; color:var(--primary); display:flex; align-items:center; gap:10px; }
        .card { background:var(--card-bg); border-radius:var(--radius); padding:20px 24px; box-shadow:var(--shadow); border:1px solid var(--border); transition:all var(--transition); margin-bottom:16px; }
        .card:hover { box-shadow:0 6px 20px rgba(0,0,0,.12); transform:translateY(-1px); }
        .grid-2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
        .grid-3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
        .match-card { background:var(--card-bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); cursor:pointer; transition:all var(--transition); position:relative; overflow:hidden; }
        .match-card:hover { box-shadow:0 8px 24px rgba(0,0,0,.14); transform:translateY(-2px); }
        .match-card.finished { border-left:4px solid var(--success); }
        .match-status { font-size:.8em; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .match-status.finished { color:var(--success); }
        .match-teams { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:12px 0; }
        .team-block { text-align:center; flex:1; }
        .team-flag { width:48px; height:48px; object-fit:contain; display:block; margin:0 auto 6px; }
        .team-name { font-weight:700; font-size:.95em; color:var(--primary); }
        .match-score { font-size:2em; font-weight:900; color:var(--primary); letter-spacing:2px; min-width:80px; text-align:center; }
        .match-info { font-size:.85em; color:var(--text-light); text-align:center; margin-top:8px; }
        .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:.78em; font-weight:700; }
        .badge-finished { background:#2a9d8f; color:#fff; }
        .standings-table { width:100%; border-collapse:collapse; font-size:.9em; }
        .standings-table th,.standings-table td { padding:10px 12px; text-align:center; border-bottom:1px solid var(--border); }
        .standings-table th { background:#f8f5ef; font-weight:700; color:var(--primary); font-size:.85em; }
        .standings-table tr:hover td { background:#fdfaf4; }
        .btn { display:inline-block; padding:10px 20px; border-radius:25px; border:none; cursor:pointer; font-weight:600; font-size:.95em; transition:all var(--transition); }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:#1e4d7b; }
        .btn-sm { padding:6px 14px; font-size:.85em; border-radius:20px; }
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:center; justify-content:center; }
        .modal { background:#fff; border-radius:14px; padding:28px 32px; max-width:600px; width:90%; box-shadow:0 20px 50px rgba(0,0,0,.3); animation:slideUp .25s ease; }
        @keyframes slideUp { from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;} }
        .toast-container { position:fixed; top:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:10px; }
        .toast { padding:14px 20px; border-radius:10px; color:#fff; font-weight:600; animation:slideIn .3s ease; box-shadow:0 6px 20px rgba(0,0,0,.2); min-width:260px; }
        @keyframes slideIn { from{transform:translateX(100px);opacity:0;} to{transform:translateX(0);opacity:1;} }
        .toast.success { background:var(--success); }
        .toast.error { background:var(--accent); }
        .toast.info { background:#457b9d; }
        .error-container { text-align:center; padding:60px 20px; }
        .error-container .icon { font-size:4em; margin-bottom:20px; }
        .error-container h3 { color:var(--accent); margin-bottom:10px; }
        .tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:2px solid var(--border); padding-bottom:0; }
        .tab { padding:10px 20px; cursor:pointer; border:none; background:transparent; font-weight:600; color:var(--text-light); transition:all var(--transition); border-bottom:3px solid transparent; margin-bottom:-2px; font-size:.95em; }
        .tab.active { color:var(--primary); border-bottom-color:var(--secondary); }
        .tab:hover { color:var(--primary); }
        @media(max-width:768px) { .header-inner{flex-direction:column;} .grid-2,.grid-3{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo"><span class="logo-icon">🏆</span><span>2026世界杯</span></div>
            <nav class="nav-links" id="navLinks">
                <button data-page="home" class="active">📊 完赛概览</button>
                <button data-page="matches">⚽ 全部比赛</button>
                <button data-page="standings">📋 积分榜</button>
                <button data-page="teams">🌍 球队</button>
            </nav>
        </div>
    </header>
    <main class="main-container" id="mainContent">
        <div style="text-align:center;padding:60px 20px;">
            <div style="font-size:4em;margin-bottom:20px;">⏳</div>
            <h3>正在获取 2026 世界杯官方数据...</h3>
            <p style="color:var(--text-light);">数据源：football-data.org（API Key 68793feb770b4da595d4ed1736d13b2b）</p>
        </div>
    </main>
    <div class="toast-container" id="toastContainer"></div>
    <div id="modalContainer"></div>

    <script>
        (function() {
            const API_KEY = '68793feb770b4da595d4ed1736d13b2b';
            const BASE_URL = 'https://api.football-data.org/v4';
            const COMPETITION_CODE = 'WC';

            let REAL_DATA = {
                teams: [],
                matches: [],
                standings: [],
                status: 'loading',   // loading | success | error
                errorMessage: ''
            };

            async function apiFetch(endpoint) {
                const resp = await fetch(`${BASE_URL}${endpoint}`, {
                    headers: { 'X-Auth-Token': API_KEY }
                });
                if (!resp.ok) throw new Error(`API ${resp.status}: ${resp.statusText}`);
                return resp.json();
            }

            async function fetchAllRealData() {
                try {
                    console.log('正在请求 2026 赛季世界杯数据...');
                    const [matchesData, teamsData, standingsData] = await Promise.all([
                        apiFetch(`/competitions/${COMPETITION_CODE}/matches?season=2026`),
                        apiFetch(`/competitions/${COMPETITION_CODE}/teams?season=2026`),
                        apiFetch(`/competitions/${COMPETITION_CODE}/standings?season=2026`)
                    ]);

                    // 处理比赛数据
                    if (matchesData.matches && matchesData.matches.length > 0) {
                        REAL_DATA.matches = matchesData.matches.map(m => ({
                            id: m.id,
                            homeTeam: m.homeTeam,
                            awayTeam: m.awayTeam,
                            score: m.score,
                            status: m.status,
                            stage: m.stage,
                            group: m.group,
                            utcDate: m.utcDate,
                            venue: m.venue || '待定'
                        }));
                    }

                    // 处理球队数据
                    if (teamsData.teams && teamsData.teams.length > 0) {
                        REAL_DATA.teams = teamsData.teams.map(t => ({
                            id: t.id,
                            name: t.name,
                            shortName: t.shortName || t.name,
                            crest: t.crest || null,
                            coach: t.coach || null
                        }));
                    }

                    // 处理积分榜数据
                    if (standingsData.standings && standingsData.standings.length > 0) {
                        REAL_DATA.standings = standingsData.standings.map(grp => ({
                            group: grp.group,
                            table: grp.table.map(row => ({
                                position: row.position,
                                team: row.team,
                                playedGames: row.playedGames,
                                won: row.won,
                                draw: row.draw,
                                lost: row.lost,
                                goalsFor: row.goalsFor,
                                goalsAgainst: row.goalsAgainst,
                                goalDifference: row.goalDifference,
                                points: row.points
                            }))
                        }));
                    }

                    if (REAL_DATA.matches.length === 0) {
                        throw new Error('API 未返回任何 2026 世界杯比赛数据（可能尚未完赛或数据未收录）');
                    }

                    REAL_DATA.status = 'success';
                    console.log(`✅ 已加载 ${REAL_DATA.matches.length} 场比赛`);
                    return true;
                } catch (e) {
                    REAL_DATA.status = 'error';
                    REAL_DATA.errorMessage = e.message;
                    console.error('数据获取失败：', e.message);
                    return false;
                }
            }

            function showToast(msg, type = 'info') {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.textContent = msg;
                container.appendChild(t);
                setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
            }

            function formatDate(utc) {
                if (!utc) return '日期待定';
                const d = new Date(utc);
                return d.toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', weekday:'short' });
            }

            function getStageText(stage, group) {
                if (stage === 'GROUP_STAGE' && group) return `小组赛 ${group} 组`;
                const map = { 'GROUP_STAGE':'小组赛', 'ROUND_OF_16':'1/8决赛', 'QUARTER_FINALS':'1/4决赛', 'SEMI_FINALS':'半决赛', 'FINAL':'决赛' };
                return map[stage] || stage || '未知阶段';
            }

            function renderMatchCard(m) {
                const homeFlag = m.homeTeam.crest ? `<img src="${m.homeTeam.crest}" class="team-flag" onerror="this.style.display='none'">` : '⚽';
                const awayFlag = m.awayTeam.crest ? `<img src="${m.awayTeam.crest}" class="team-flag" onerror="this.style.display='none'">` : '⚽';
                const score = (m.status === 'FINISHED') ? `${m.score.fullTime.home ?? '-'} - ${m.score.fullTime.away ?? '-'}` : 'VS';
                const stage = getStageText(m.stage, m.group);
                return `
                <div class="match-card finished" data-match-id="${m.id}">
                    <span class="match-status finished">✅ 已结束</span>
                    <span class="badge badge-finished" style="margin-left:8px;">${stage}</span>
                    <div class="match-teams">
                        <div class="team-block">${homeFlag}<span class="team-name">${m.homeTeam.shortName || m.homeTeam.name}</span></div>
                        <span class="match-score">${score}</span>
                        <div class="team-block">${awayFlag}<span class="team-name">${m.awayTeam.shortName || m.awayTeam.name}</span></div>
                    </div>
                    <div class="match-info">📅 ${formatDate(m.utcDate)} | 🏟️ ${m.venue || '待定'}</div>
                </div>`;
            }

            function openModal(title, html) {
                const container = document.getElementById('modalContainer');
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `<div class="modal"><button class="modal-close" style="float:right;background:none;border:none;font-size:1.5em;cursor:pointer;">&times;</button><h3>${title}</h3><div style="margin-top:12px;">${html}</div></div>`;
                container.appendChild(overlay);
                overlay.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
                overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            }

            function showMatchDetail(matchId) {
                const m = REAL_DATA.matches.find(x => x.id === matchId);
                if (!m) return;
                const hf = m.homeTeam.crest ? `<img src="${m.homeTeam.crest}" style="width:50px;vertical-align:middle;">` : '⚽';
                const af = m.awayTeam.crest ? `<img src="${m.awayTeam.crest}" style="width:50px;vertical-align:middle;">` : '⚽';
                const score = m.status === 'FINISHED' ? `${m.score.fullTime.home} - ${m.score.fullTime.away}` : 'VS';
                const html = `
                    <div style="text-align:center;">
                        <span style="font-size:3em;">${hf} ${score} ${af}</span>
                        <h3>${m.homeTeam.name} vs ${m.awayTeam.name}</h3>
                        <p>📅 ${formatDate(m.utcDate)} | 🏟️ ${m.venue || '待定'}</p>
                        <p>🏆 ${getStageText(m.stage, m.group)}</p>
                    </div>`;
                openModal('比赛详情', html);
            }

            let currentPage = 'home';
            function navigateTo(page) {
                currentPage = page;
                document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-page="${page}"]`).classList.add('active');
                renderPage();
            }

            function renderPage() {
                if (REAL_DATA.status === 'loading') {
                    document.getElementById('mainContent').innerHTML = `
                        <div style="text-align:center;padding:60px;">
                            <div style="font-size:4em;">⏳</div>
                            <h3>正在连接 football-data.org...</h3>
                        </div>`;
                    return;
                }
                if (REAL_DATA.status === 'error') {
                    document.getElementById('mainContent').innerHTML = `
                        <div class="error-container">
                            <div class="icon">❌</div>
                            <h3>2026 世界杯数据暂不可用</h3>
                            <p>错误信息：${REAL_DATA.errorMessage}</p>
                            <p>可能原因：比赛尚未完赛、API 未收录 2026 赛季数据，或 API 密钥配额用尽。</p>
                            <p>本平台仅展示真实数据，不会编造任何比分或赛程。</p>
                            <button class="btn btn-primary" onclick="location.reload()">🔄 重新尝试</button>
                        </div>`;
                    return;
                }

                switch (currentPage) {
                    case 'home': renderHome(); break;
                    case 'matches': renderMatches(); break;
                    case 'standings': renderStandings(); break;
                    case 'teams': renderTeams(); break;
                }
                document.querySelectorAll('.match-card').forEach(c => {
                    c.addEventListener('click', () => showMatchDetail(parseInt(c.dataset.matchId)));
                });
            }

            function renderHome() {
                const finished = REAL_DATA.matches.filter(m => m.status === 'FINISHED');
                const recent = [...finished].sort((a,b) => new Date(b.utcDate) - new Date(a.utcDate)).slice(0,8);
                let html = `
                    <div class="page-title">🏟️ 2026世界杯 · 完赛数据</div>
                    <div class="grid-2" style="margin-bottom:20px;">
                        <div class="card" style="text-align:center;"><div style="font-size:3em;">⚽</div><div style="font-size:1.5em;font-weight:900;">${REAL_DATA.matches.length}</div><div>总场次</div></div>
                        <div class="card" style="text-align:center;"><div style="font-size:3em;">✅</div><div style="font-size:1.5em;font-weight:900;">${finished.length}</div><div>已完赛</div></div>
                    </div>
                    <h3>最近比赛</h3><div class="grid-2">${recent.map(m => renderMatchCard(m)).join('')}</div>`;
                document.getElementById('mainContent').innerHTML = html;
            }

            function renderMatches() {
                const matches = [...REAL_DATA.matches].sort((a,b) => new Date(b.utcDate) - new Date(a.utcDate));
                let html = `<div class="page-title">⚽ 全部比赛 (${matches.length})</div><div class="grid-2">`;
                html += matches.map(m => renderMatchCard(m)).join('') + '</div>';
                document.getElementById('mainContent').innerHTML = html;
            }

            function renderStandings() {
                if (REAL_DATA.standings.length === 0) {
                    document.getElementById('mainContent').innerHTML = '<div class="page-title">📋 积分榜</div><div class="card">暂无积分榜数据</div>';
                    return;
                }
                let html = '<div class="page-title">📋 小组积分榜</div>';
                REAL_DATA.standings.forEach(g => {
                    html += `<h3 style="margin:16px 0 8px;">${g.group.replace('GROUP_','')} 组</h3>`;
                    html += `<table class="standings-table"><thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>净</th><th>分</th></tr></thead><tbody>`;
                    g.table.forEach(row => {
                        const flag = row.team.crest ? `<img src="${row.team.crest}" style="width:20px;vertical-align:middle;margin-right:6px;">` : '';
                        html += `<tr><td>${row.position}</td><td style="text-align:left;">${flag}${row.team.shortName || row.team.name}</td><td>${row.playedGames}</td><td>${row.won}</td><td>${row.draw}</td><td>${row.lost}</td><td>${row.goalsFor}</td><td>${row.goalsAgainst}</td><td>${row.goalDifference}</td><td><strong>${row.points}</strong></td></tr>`;
                    });
                    html += `</tbody></table>`;
                });
                document.getElementById('mainContent').innerHTML = html;
            }

            function renderTeams() {
                let html = '<div class="page-title">🌍 参赛球队</div><div class="grid-3">';
                REAL_DATA.teams.forEach(t => {
                    const crest = t.crest ? `<img src="${t.crest}" style="width:60px;height:60px;object-fit:contain;margin-bottom:8px;" onerror="this.style.display='none'">` : '<div style="font-size:3em;">⚽</div>';
                    html += `<div class="card" style="text-align:center;">${crest}<div style="font-weight:700;">${t.name}</div><div style="color:var(--text-light);font-size:0.85em;">${t.shortName || ''}</div>${t.coach ? '<div style="font-size:0.8em;">教练: '+t.coach.name+'</div>' : ''}</div>`;
                });
                html += '</div>';
                document.getElementById('mainContent').innerHTML = html;
            }

            document.getElementById('navLinks').addEventListener('click', e => {
                if (e.target.tagName === 'BUTTON' && e.target.dataset.page) navigateTo(e.target.dataset.page);
            });

            async function init() {
                await fetchAllRealData();
                if (REAL_DATA.status === 'success') {
                    showToast(`已加载 ${REAL_DATA.matches.length} 场 2026 世界杯比赛`, 'success');
                } else {
                    showToast('数据获取失败，请检查 API 状态', 'error');
                }
                renderPage();
            }
            init();
        })();
    </script>
</body>
</html>
