    <style>

        *{margin:0;padding:0;box-sizing:border-box}

        .header{background:linear-gradient(135deg,#0d2847,#1a3c5e 40%,#1e4d7b);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.3)}
        .header-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;flex-wrap:wrap;gap:10px}
        .logo{display:flex;align-items:center;gap:12px;font-size:1.4em;font-weight:700}
        .logo-icon{width:44px;height:44px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:1.6em}
        .nav-links{display:flex;gap:6px;flex-wrap:wrap}
        .nav-links button{background:rgba(255,255,255,.08);color:#e0d8cc;border:1px solid rgba(255,255,255,.15);padding:9px 18px;border-radius:25px;cursor:pointer;font-size:.95em;transition:.2s;font-weight:500}
        .nav-links button:hover,.nav-links button.active{background:rgba(255,255,255,.2);color:#fff;border-color:var(--secondary)}
        .nav-links button.active{background:var(--secondary);color:#1a3c5e;border-color:var(--secondary);font-weight:700}
        .main-container{max-width:1300px;margin:0 auto;padding:24px}
        .page-title{font-size:1.8em;font-weight:700;margin-bottom:20px;color:var(--primary);display:flex;align-items:center;gap:10px}
        .card{background:var(--card);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);border:1px solid var(--border);transition:.2s;margin-bottom:16px}
        .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-1px)}
        .grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
        .grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
        .grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
        .match-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:.2s;border-left:4px solid var(--success)}
        .match-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.14);transform:translateY(-2px)}
        .match-status{font-size:.8em;font-weight:700;margin-bottom:6px;color:var(--success)}
        .match-teams{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
        .team-block{text-align:center;flex:1;min-width:70px}
        .team-flag{font-size:2.2em;display:block;margin-bottom:4px}
        .team-name{font-weight:700;font-size:.9em;color:var(--primary);word-break:break-word}
        .match-score{font-size:1.8em;font-weight:900;color:var(--primary);min-width:80px;text-align:center}
        .match-info{font-size:.85em;color:var(--light);text-align:center;margin-top:8px}
        .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78em;font-weight:700;background:var(--success);color:#fff;margin-right:4px}
        .standings-table{width:100%;border-collapse:collapse;font-size:.9em;margin-bottom:20px}
        .standings-table th,.standings-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
        .standings-table th{background:#f8f5ef;font-weight:700;color:var(--primary);font-size:.85em}
        .standings-table tr:hover td{background:#fdfaf4}
        .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0;flex-wrap:wrap}
        .tab{padding:10px 20px;cursor:pointer;border:none;background:transparent;font-weight:600;color:var(--light);transition:.2s;border-bottom:3px solid transparent;margin-bottom:-2px}
        .tab.active{color:var(--primary);border-bottom-color:var(--secondary)}
        .btn{display:inline-block;padding:10px 20px;border-radius:25px;border:none;cursor:pointer;font-weight:600;font-size:.95em;transition:.2s}
        .btn-primary{background:var(--primary);color:#fff}
        .btn-primary:hover{background:#1e4d7b}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
        .modal{background:#fff;border-radius:14px;padding:28px 32px;max-width:600px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:slideUp .25s ease}
        @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
        .toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:10px;color:#fff;font-weight:600;background:var(--success);z-index:300;animation:slideIn .3s ease}
        @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
        .error-box{background:#fff0f0;border:2px solid var(--accent);padding:20px;border-radius:10px;margin:20px 0;color:var(--accent)}
    </style>
</head>

// ========== 工具函数 ==========
function getTeamById(id) { return TEAMS.find(t => t.id === id) || { name: '?', flag: '❓' }; }
function formatDate(str) { return str; }

function computeStandings() {
    const groups = 'ABCDEFGHIJKL'.split('');
    return groups.map(g => {
        const groupTeams = TEAMS.filter(t => t.group === g);
        const groupMatches = MATCHES.filter(m => m.group === g && m.stage === 'GROUP');
        const table = groupTeams.map(team => {
            let p=0,w=0,d=0,l=0,gf=0,ga=0;
            groupMatches.forEach(m => {
                if (m.home === team.id) {
                    p++; gf += m.score_h; ga += m.score_a;
                    if (m.score_h > m.score_a) w++; else if (m.score_h === m.score_a) d++; else l++;
                } else if (m.away === team.id) {
                    p++; gf += m.score_a; ga += m.score_h;
                    if (m.score_a > m.score_h) w++; else if (m.score_a === m.score_h) d++; else l++;
                }
            });
            return { team: team.id, played: p, w, d, l, gf, ga, gd: gf - ga, pts: w * 3 + d };
        }).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
        return { group: g, table };
    });
}
const STANDINGS = computeStandings();

// ========== 页面状态 ==========
let currentPage = 'home';
let user = localStorage.getItem('wc_user') || '球迷';
let myPredictions = [];
let discussionComments = [];

// ========== API 调用 ==========
async function loadMyPredictions() {
    try {
        const res = await fetch(`/api/predictions?username=${encodeURIComponent(user)}`);
        myPredictions = await res.json();
    } catch(e) { myPredictions = []; }
}
async function loadComments(matchId = null) {
    try {
        const url = matchId ? `/api/comments?matchId=${matchId}` : '/api/comments';
        const res = await fetch(url);
        discussionComments = await res.json();
    } catch(e) { discussionComments = []; }
}

function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

// ========== 导航 ==========
document.getElementById('navLinks').addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON') {
        currentPage = e.target.dataset.page;
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        render();
    }
});

// ========== 渲染函数 ==========
function matchCard(m) {
    const h = getTeamById(m.home), a = getTeamById(m.away);
    let score = `${m.score_h} - ${m.score_a}`;
    if (m.penalties) score += ` (点球 ${m.penalties.home}-${m.penalties.away})`;
    if (m.extra) score += ` [${m.extra}]`;
    const stageText = m.stage === 'GROUP' ? `小组赛 ${m.group}组` :
        (m.stage === 'R32' ? '1/16决赛' : (m.stage === 'R16' ? '1/8决赛' : (m.stage === 'QF' ? '1/4决赛' : (m.stage === 'SF' ? '半决赛' : (m.stage === '3RD' ? '季军赛' : '决赛')))));
    return `<div class="match-card" data-id="${m.id}">
        <span class="match-status">✅ 已结束</span><span class="badge">${stageText}</span>
        <div class="match-teams">
            <div class="team-block"><span class="team-flag">${h.flag}</span><span class="team-name">${h.name}</span></div>
            <span class="match-score">${score}</span>
            <div class="team-block"><span class="team-flag">${a.flag}</span><span class="team-name">${a.name}</span></div>
        </div>
        <div class="match-info">${m.date} ${m.group ? '| ' + m.group + '组' : ''}</div>
    </div>`;
}

function bindMatchCards() {
    document.querySelectorAll('.match-card').forEach(card => {
        card.addEventListener('click', function () {
            const id = parseInt(this.dataset.id);
            const m = MATCHES.find(x => x.id === id);
            if (!m) return;
            const h = getTeamById(m.home), a = getTeamById(m.away);
            let scoreText = `${m.score_h} - ${m.score_a}`;
            if (m.penalties) scoreText += ` (点球 ${m.penalties.home}-${m.penalties.away})`;
            if (m.extra) scoreText += ` [${m.extra}]`;
            const html = `<div style="text-align:center">
                <span style="font-size:3em">${h.flag} ${m.score_h} - ${m.score_a} ${a.flag}</span>
                <h3>${h.name} vs ${a.name}</h3>
                <p>${m.date} ${m.stage === 'GROUP' ? '小组赛 ' + m.group + '组' : ''} ${m.extra || ''}</p>
            </div>`;
            document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay"><div class="modal"><button class="modal-close" style="float:right">&times;</button>${html}</div></div>`;
            document.querySelector('.modal-close').addEventListener('click', () => document.getElementById('modalContainer').innerHTML = '');
        });
    });
}

function renderHome() {
    const final = MATCHES.find(m => m.stage === 'FINAL');
    document.getElementById('mainContent').innerHTML = `
        <div class="page-title">🏆 2026世界杯完赛数据</div>
        <div class="grid-2" style="margin-bottom:20px">
            <div class="card" style="text-align:center"><div style="font-size:3em">⚽</div><div style="font-size:2em;font-weight:900">${MATCHES.length}</div><div>总场次</div></div>
            <div class="card" style="text-align:center"><div style="font-size:3em">🏆</div><div style="font-size:1.5em;font-weight:900">${final ? getTeamById(final.home).flag + getTeamById(final.home).name + ' ' + final.score_h + '-' + final.score_a + ' ' + getTeamById(final.away).name + getTeamById(final.away).flag : '待定'}</div><div>决赛</div></div>
        </div>
        <h3>关键淘汰赛结果</h3>
        <div class="grid-2">${MATCHES.filter(m => ['FINAL', '3RD', 'SF'].includes(m.stage)).map(m => matchCard(m)).join('')}</div>
    `;
    bindMatchCards();
}

function renderMatches() {
    const all = [...MATCHES].sort((a, b) => a.date.localeCompare(b.date));
    document.getElementById('mainContent').innerHTML = `<div class="page-title">⚽ 全部比赛 (${all.length}场)</div><div class="grid-2">${all.map(m => matchCard(m)).join('')}</div>`;
    bindMatchCards();
}

function renderStandingsPage() {
    let html = '<div class="page-title">📋 小组积分榜 (12组)</div>';
    STANDINGS.forEach(g => {
        html += `<h3 style="margin:16px 0 8px">${g.group} 组</h3>
        <table class="standings-table"><thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>净</th><th>分</th></tr></thead><tbody>`;
        g.table.forEach((row, i) => {
            const team = getTeamById(row.team);
            html += `<tr><td>${i + 1}</td><td style="text-align:left">${team.flag} ${team.name}</td><td>${row.played}</td><td>${row.w}</td><td>${row.d}</td><td>${row.l}</td><td>${row.gf}</td><td>${row.ga}</td><td>${row.gd}</td><td><strong>${row.pts}</strong></td></tr>`;
        });
        html += `</tbody></table>`;
    });
    document.getElementById('mainContent').innerHTML = html;
}

function renderTeams() {
    document.getElementById('mainContent').innerHTML = `<div class="page-title">🌍 参赛球队 (48队)</div><div class="grid-4">${TEAMS.map(t => `
        <div class="card" style="text-align:center">
            <div style="font-size:2.5em">${t.flag}</div>
            <div style="font-weight:700">${t.name}</div>
            <div style="color:var(--light)">${t.group} 组</div>
        </div>`).join('')}</div>`;
}

async function renderPredictions() {
    await loadMyPredictions();
    let html = `<div class="page-title">🔮 比分预测</div>
        <p>选择比赛提交预测（与实际结果对比）</p>
        <div class="card">
            <select id="matchSelect">${MATCHES.map(m => `<option value="${m.id}">${getTeamById(m.home).name} vs ${getTeamById(m.away).name} (${m.date})</option>`).join('')}</select>
            <input type="number" id="predHome" min="0" value="0" style="width:50px"> : <input type="number" id="predAway" min="0" value="0" style="width:50px">
            <button class="btn btn-primary" id="submitPred">提交预测</button>
        </div>
        <h3>我的预测记录</h3>
        <div id="predList">`;
    if (myPredictions.length === 0) {
        html += '<p>暂无预测记录</p>';
    } else {
        html += myPredictions.slice(-15).reverse().map(p => {
            const h = getTeamById(p.home_team_id), a = getTeamById(p.away_team_id);
            const correct = (p.predicted_home === p.score_home && p.predicted_away === p.score_away);
            return `<div class="card"><strong>${h.name} vs ${a.name}</strong> 预测 ${p.predicted_home}-${p.predicted_away} | 实际 ${p.score_home}-${p.score_away} ${correct ? '🎯' : '❌'}</div>`;
        }).join('');
    }
    html += `</div>`;
    document.getElementById('mainContent').innerHTML = html;
    document.getElementById('submitPred').addEventListener('click', async () => {
        const id = parseInt(document.getElementById('matchSelect').value);
        const home = parseInt(document.getElementById('predHome').value) || 0;
        const away = parseInt(document.getElementById('predAway').value) || 0;
        const res = await fetch('/api/predictions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matchId: id, home, away, username: user })
        });
        if (res.status === 409) {
            toast('比赛已结束，无法预测');
            return;
        }
        toast('预测已提交');
        document.getElementById('predHome').value = 0;
        document.getElementById('predAway').value = 0;
        renderPredictions();
    });
}

async function renderDiscuss() {
    await loadComments(null);
    let html = `<div class="page-title">💬 讨论区</div>
        <textarea id="commInput" style="width:100%;height:80px;padding:10px;border-radius:8px;border:1px solid var(--border)" placeholder="发表评论..."></textarea>
        <button class="btn btn-primary" id="submitComm" style="margin:8px 0 20px">发送</button>
        <div>${discussionComments.map(c => `<div class="card"><strong>${c.username}</strong> <small>${c.created_at}</small><p>${c.content}</p></div>`).join('')}</div>`;
    document.getElementById('mainContent').innerHTML = html;
    document.getElementById('submitComm').addEventListener('click', async () => {
        const text = document.getElementById('commInput').value.trim();
        if (!text) return toast('请输入内容');
        await fetch('/api/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, content: text })
        });
        document.getElementById('commInput').value = '';
        renderDiscuss();
    });
}

function render() {
    try {
        if (currentPage === 'home') renderHome();
        else if (currentPage === 'matches') renderMatches();
        else if (currentPage === 'standings') renderStandingsPage();
        else if (currentPage === 'teams') renderTeams();
        else if (currentPage === 'predictions') renderPredictions();
        else if (currentPage === 'discuss') renderDiscuss();
    } catch (e) {
        document.getElementById('mainContent').innerHTML = `<div class="error-box"><h3>渲染出错</h3><p>${e.message}</p></div>`;
    }
}
render();
</script>
